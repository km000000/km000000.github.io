<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KONG | Server Core</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600&family=JetBrains+Mono:wght@400;700&display=swap');
        
        /* 修复：移除 overflow: hidden，允许页面在需要时滚动 */
        body {
            background: #000;
            margin: 0;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            user-select: none;
            min-height: 100dvh;
        }

        /* 动态背景：固定定位，不随滚动条移动 */
        .wallpaper {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(at 0% 0%, #1a1a2e 0%, transparent 40%),
                        radial-gradient(at 100% 100%, #1a2e1a 0%, transparent 40%);
            filter: brightness(0.6) blur(40px);
        }

        /* iOS 26 核心材质：增强饱和度 */
        .ios-card {
            background: rgba(32, 32, 35, 0.4);
            backdrop-filter: blur(50px) saturate(230%);
            -webkit-backdrop-filter: blur(50px) saturate(230%);
            border: 0.5px solid rgba(255, 255, 255, 0.12);
            border-top: 1px solid rgba(255, 255, 255, 0.2); /* 增加顶部高光边缘 */
            border-radius: 36px;
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .ios-btn-press {
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .ios-btn-press:active {
            transform: scale(0.94);
            background: rgba(255, 255, 255, 0.1);
        }
        /* 激活状态切换 */
        .ios-btn-press.active-state {
            background: rgba(255, 255, 255, 0.95) !important;
            color: #000 !important;
        }
        .ios-btn-press.active-state .status-label { color: #000; opacity: 0.6; }

        .freq-bar {
            width: 6px;
            background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
            border-radius: 4px;
            transition: height 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .storage-bar-fill {
            transition: width 2s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(90deg, #fff, rgba(255,255,255,0.3));
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        /* 修复：入场动画包含位移，更具动感 */
        .entrance { 
            animation: iosIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes iosIn { 
            from { transform: scale(1.05) translateY(30px); opacity: 0; } 
            to { transform: scale(1) translateY(0); opacity: 1; } 
        }
    </style>
</head>
<body class="flex justify-center">
    <div class="wallpaper"></div>

    <div class="entrance w-full max-w-md px-6 pt-12 pb-24 flex flex-col">
        
        <header class="flex justify-between items-start mb-10 px-2">
            <div>
                <h1 class="text-3xl font-bold tracking-tight" style="font-family: 'Space Grotesk'">NODE_KONG</h1>
                <p class="text-white/40 text-[10px] tracking-[0.4em] uppercase mt-1">Status: Operational</p>
            </div>
            <div class="ios-card px-3 py-1 text-[10px] bg-white/10 border-none font-bold">2.4.0_RC</div>
        </header>

        <div class="space-y-5">
            <div class="ios-card p-6">
                <div class="flex justify-between items-center mb-6">
                    <span class="text-[10px] font-bold text-white/50 tracking-widest uppercase">Cpu Frequency</span>
                    <span id="freq-val" class="text-xs mono font-bold text-white/90">2.441 GHz</span>
                </div>
                <div id="visualizer" class="flex items-end justify-between h-14 px-1">
                    </div>
            </div>

            <div class="ios-card p-6">
                <div class="flex justify-between text-[10px] mb-4 tracking-widest uppercase text-white/50">
                    <span class="font-bold">Server Storage</span>
                    <span id="storage-text" class="mono text-white">88.421 / 100.000 TB</span>
                </div>
                <div class="w-full bg-white/5 h-2 rounded-full overflow-hidden border border-white/5">
                    <div id="storage-bar" class="storage-bar-fill h-full w-[88.421%] shadow-[0_0_15px_rgba(255,255,255,0.3)]"></div>
                </div>
                <div class="mt-4 flex justify-between items-center">
                    <span class="text-[9px] text-white/20 mono tracking-tighter">UPTIME: 1,422 HOURS</span>
                    <span class="text-[9px] text-green-400/50 mono tracking-tighter">ENCRYPTED</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div onclick="toggleNode(this)" class="ios-card p-6 ios-btn-press active-state">
                    <div class="icon-box w-10 h-10 bg-white/10 rounded-2xl mb-8 flex items-center justify-center transition-all duration-500">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <p class="font-bold text-sm tracking-tight">加速引擎</p>
                    <p class="status-label text-[10px] opacity-40 mt-1">已开启</p>
                </div>

                <div onclick="toggleNode(this)" class="ios-card p-6 ios-btn-press">
                    <div class="icon-box w-10 h-10 bg-white/10 rounded-2xl mb-8 flex items-center justify-center transition-all duration-500">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </div>
                    <p class="font-bold text-sm tracking-tight">视觉锁定</p>
                    <p class="status-label text-[10px] opacity-40 mt-1">待机中</p>
                </div>
            </div>

            <div class="ios-card p-6 h-36 relative overflow-hidden">
                <div class="flex justify-between items-center mb-3">
                    <span class="text-[10px] font-bold text-white/30 uppercase tracking-widest">System Logs</span>
                    <div class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_#22c55e]"></div>
                </div>
                <div id="logs" class="mono text-[9px] text-white/30 space-y-1.5">
                    <p class="text-white/60">> [SYSTEM] KERNEL BOOT SUCCESS</p>
                    <p>> [INFO] NODE_KONG_V2.4 ONLINE</p>
                </div>
            </div>
        </div>

        <button onclick="goBack()" class="mt-12 w-full py-5 rounded-[28px] font-bold text-sm bg-white text-black shadow-[0_15px_30px_rgba(255,255,255,0.1)] active:scale-95 transition-all duration-300 uppercase tracking-widest">
            Return to Surface
        </button>
    </div>

    <script>
        // --- 1. 频率监控 (优化：增加随机波动感) ---
        const visualizer = document.getElementById('visualizer');
        const freqVal = document.getElementById('freq-val');
        const bars = [];
        for(let i=0; i<20; i++) {
            const bar = document.createElement('div');
            bar.className = 'freq-bar';
            bar.style.height = '40%';
            visualizer.appendChild(bar);
            bars.push(bar);
        }

        function updateFreq() {
            bars.forEach((bar, i) => {
                const time = Date.now() / 600; 
                const wave = Math.sin(time + i * 0.4) * 30 + 50;
                const jitter = Math.random() * 15;
                bar.style.height = `${wave + jitter}%`;
                bar.style.opacity = (wave + jitter)/115;
            });
            freqVal.innerText = (2.4 + Math.sin(Date.now()/2500)*0.045).toFixed(3) + " GHz";
        }
        setInterval(updateFreq, 80);

        // --- 2. 存储增长逻辑 ---
        let currentStorage = 88.421556;
        const storageText = document.getElementById('storage-text');
        const storageBar = document.getElementById('storage-bar');

        function growStorage() {
            const gap = 100 - currentStorage;
            const increment = gap * 0.000008 * Math.random(); 
            currentStorage += increment;
            storageText.innerText = `${currentStorage.toFixed(6)} / 100.000 TB`;
            storageBar.style.width = `${currentStorage}%`;
            if(Math.random() > 0.9) addLog(`DATA FEED: +${(increment*1024).toFixed(4)} MB`);
        }
        setInterval(growStorage, 1500);

        // --- 3. 交互逻辑 ---
        function toggleNode(el) {
            // 修复：更正 class 名为 active-state 避免与系统 class 冲突
            el.classList.toggle('active-state');
            const isActive = el.classList.contains('active-state');
            const label = el.querySelector('.status-label');
            const iconBox = el.querySelector('.icon-box');
            
            label.innerText = isActive ? "已开启" : "已关闭";
            iconBox.style.background = isActive ? "rgba(0,0,0,0.1)" : "rgba(255,255,255,0.1)";
            
            addLog(`MODULE [${el.querySelector('p.font-bold').innerText}] ${isActive ? 'SIGNAL ON' : 'SIGNAL OFF'}`);
        }

        function addLog(msg) {
            const container = document.getElementById('logs');
            const p = document.createElement('p');
            const now = new Date();
            const timeStr = `${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}`;
            p.innerHTML = `<span style="opacity: 0.5">[${timeStr}]</span> > ${msg}`;
            container.prepend(p);
            if(container.children.length > 6) container.lastChild.remove();
        }

        function goBack() {
            document.body.style.opacity = '0';
            document.body.style.transform = 'translateY(20px) scale(0.95)';
            document.body.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            setTimeout(() => window.location.href = 'index.html', 500);
        }
    </script>
</body>
</html>
