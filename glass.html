<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>KONG | Server Core v26</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;600&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            background: #000;
            margin: 0;
            color: #fff;
            -webkit-font-smoothing: antialiased;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            user-select: none;
            /* --- 核心修复：允许滑动 --- */
            overflow-x: hidden;
            overflow-y: auto; 
            min-height: 100dvh;
            /* 改善移动端滑动体验 */
            -webkit-overflow-scrolling: touch;
        }

        /* 动态背景：固定定位，不随页面滚动 */
        .wallpaper {
            position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 15% 15%, #1e1b4b 0%, transparent 45%),
                        radial-gradient(circle at 85% 85%, #064e3b 0%, transparent 45%);
            filter: blur(70px) brightness(0.7);
        }

        /* iOS 26 究极材质 */
        .ios-glass {
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(50px) saturate(230%);
            -webkit-backdrop-filter: blur(50px) saturate(230%);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                inset 0 1px 1px rgba(255, 255, 255, 0.2),
                0 20px 40px rgba(0, 0, 0, 0.5);
            /* 物理弹簧曲线：0.175, 0.885, 0.32, 1.275 赋予回弹感 */
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        background 0.4s ease, 
                        box-shadow 0.4s ease;
        }

        /* 按下时的深压感 */
        .ios-glass:active {
            transform: scale(0.94) translateY(2px);
            background: rgba(255, 255, 255, 0.08);
            transition: transform 0.1s ease-out; /* 按下要快 */
        }

        .active-state {
            background: rgba(255, 255, 255, 0.96) !important;
            color: #000 !important;
        }
        .active-state .status-label { color: rgba(0,0,0,0.5); }
        .active-state .icon-box { background: rgba(0,0,0,0.06) !important; color: #000; }

        .freq-bar {
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 99px;
        }

        .mono { font-family: 'JetBrains Mono', monospace; }

        .entrance { 
            animation: iosIn 1.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes iosIn { 
            from { transform: scale(1.05) translateY(30px); opacity: 0; filter: blur(20px); } 
            to { transform: scale(1) translateY(0); opacity: 1; filter: blur(0); } 
        }
    </style>
</head>
<body class="flex justify-center p-6">
    <div class="wallpaper"></div>

    <div class="entrance w-full max-w-md flex flex-col pt-10 pb-24">
        <header class="flex justify-between items-end mb-10 px-2">
            <div>
                <p class="text-white/30 text-[10px] tracking-[0.5em] uppercase mb-1">Architecture / Kong</p>
                <h1 class="text-4xl font-bold tracking-tighter italic" style="font-family: 'Space Grotesk'">CORE</h1>
            </div>
            <div class="ios-glass px-4 py-1.5 text-[10px] mono font-bold border-none">SYSTEM_v26</div>
        </header>

        <div class="space-y-6">
            <div class="ios-glass p-8">
                <div class="flex justify-between items-center mb-8">
                    <div class="flex flex-col">
                        <span class="text-[10px] font-bold text-white/30 tracking-widest uppercase">实时处理器负载</span>
                        <span id="freq-val" class="text-2xl mono font-light">2.441 GHz</span>
                    </div>
                    <div class="h-2 w-2 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.6)] animate-pulse"></div>
                </div>
                <div id="visualizer" class="flex items-end justify-between h-20 gap-[2px]"></div>
            </div>

            <div class="ios-glass p-8">
                <div class="flex justify-between text-[10px] mb-4 tracking-widest uppercase">
                    <span class="font-bold text-white/30">集群存储状态</span>
                    <span id="storage-text" class="mono text-white/70">88.42%</span>
                </div>
                <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden p-[0.5px]">
                    <div id="storage-bar" class="h-full w-[88.42%] rounded-full bg-gradient-to-r from-white/40 to-white shadow-[0_0_15px_rgba(255,255,255,0.4)]"></div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div onclick="toggleNode(this)" class="ios-glass p-7 cursor-pointer group">
                    <div class="icon-box w-12 h-12 bg-white/5 rounded-2xl mb-10 flex items-center justify-center transition-all">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    </div>
                    <p class="font-bold text-lg tracking-tight">加速引擎</p>
                    <p class="status-label text-[10px] opacity-40 mt-1 uppercase tracking-widest">已待机</p>
                </div>

                <div onclick="toggleNode(this)" class="ios-glass p-7 cursor-pointer group">
                    <div class="icon-box w-12 h-12 bg-white/5 rounded-2xl mb-10 flex items-center justify-center transition-all">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </div>
                    <p class="font-bold text-lg tracking-tight">视觉锁定</p>
                    <p class="status-label text-[10px] opacity-40 mt-1 uppercase tracking-widest">已关闭</p>
                </div>
            </div>

            <div class="ios-glass p-6">
                <div id="logs" class="mono text-[10px] text-white/20 space-y-2 h-24 overflow-hidden">
                    <p class="text-white/40">> 系统内核初始化完毕</p>
                    <p class="text-white/40">> 管理员已接入会话...</p>
                </div>
            </div>
        </div>

        <button onclick="goBack()" class="mt-12 mb-10 ios-glass w-full py-6 font-bold text-[10px] uppercase tracking-[0.4em] active:scale-95">
            退出终端会话
        </button>
    </div>

    <script>
        // 1. CPU 动画：采用低频平滑波浪
        const visualizer = document.getElementById('visualizer');
        const bars = [];
        for(let i=0; i < 32; i++) {
            const bar = document.createElement('div');
            bar.className = 'freq-bar';
            bar.style.height = '20%';
            visualizer.appendChild(bar);
            bars.push(bar);
        }

        let time = 0;
        function animate() {
            time += 0.015; // 显著降低速度，增加呼吸感
            bars.forEach((bar, i) => {
                const wave = Math.sin(time + i * 0.15) * 30;
                const subWave = Math.sin(time * 0.5 + i * 0.1) * 20;
                const h = 45 + wave + subWave + (Math.random() * 5);
                bar.style.height = `${Math.max(15, h)}%`;
                bar.style.backgroundColor = `rgba(255,255,255,${0.1 + (h/100)*0.5})`;
            });
            const freq = 2.441 + Math.sin(time * 0.3) * 0.005;
            document.getElementById('freq-val').innerText = freq.toFixed(3) + " GHz";
            requestAnimationFrame(animate);
        }
        animate();

        // 2. 交互逻辑
        function toggleNode(el) {
            const isActive = el.classList.toggle('active-state');
            el.querySelector('.status-label').innerText = isActive ? "运行中" : "已待机";
            addLog(`模块 [${el.querySelector('p.font-bold').innerText}] ${isActive ? '激活' : '断开'}`);
            if (window.navigator.vibrate) window.navigator.vibrate(isActive ? [10, 30] : 10);
        }

        function addLog(msg) {
            const container = document.getElementById('logs');
            const p = document.createElement('p');
            const now = new Date();
            p.style.opacity = '0';
            p.style.transform = 'translateX(-10px)';
            p.style.transition = 'all 0.5s ease';
            p.innerHTML = `<span style="opacity:0.5">[${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}]</span> > ${msg}`;
            container.prepend(p);
            setTimeout(() => { p.style.opacity = '1'; p.style.transform = 'translateX(0)'; }, 10);
            if(container.children.length > 5) container.lastChild.remove();
        }

        function goBack() {
            document.body.style.opacity = '0';
            document.body.style.transform = 'translateY(20px)';
            document.body.style.transition = '0.8s cubic-bezier(0.16, 1, 0.3, 1)';
            setTimeout(() => window.location.href = 'index.html', 600);
        }
    </script>
</body>
</html>
