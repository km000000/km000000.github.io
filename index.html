<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KONG - 未来已来</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap');
        
        :root { --accent: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }

        /* 顶级背景 */
        #bg-canvas { position: fixed; inset: 0; z-index: 0; }
        .glow-sphere {
            position: absolute; border-radius: 50%; filter: blur(120px); z-index: 1; opacity: 0.15;
            animation: move 20s infinite alternate ease-in-out;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(10%, 10%); }
        }

        /* 核心视觉 */
        .glow { text-shadow: 0 0 30px rgba(255,255,255,0.3); }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* iOS 风格特殊按钮 */
        .ios-glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* 修复小白点 */
        #cursor {
            width: 12px; height: 12px; background: #fff; border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999;
            mix-blend-mode: difference;
            display: none;
        }
        @media (pointer: fine) { #cursor { display: block; } }

        /* 转场动画 */
        .page-transition { animation: zoomIn 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .dimension-exit { animation: zoomOut 0.8s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
        @keyframes zoomOut {
            to { opacity: 0; transform: scale(1.2); filter: blur(20px); }
        }

        #inner-space { display: none; opacity: 0; }
        
        .btn-hover-effect:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="flex items-center justify-center">

    <canvas id="bg-canvas"></canvas>
    <div class="glow-sphere w-[500px] h-[500px] bg-purple-900 top-[-10%] left-[-10%]"></div>
    <div class="glow-sphere w-[600px] h-[600px] bg-blue-900 bottom-[-10%] right-[-10%]" style="animation-delay: -5s;"></div>
    
    <div id="cursor"></div>

    <main id="home-page" class="relative z-10 text-center px-6 w-full max-w-4xl page-transition">
        <h1 class="text-[clamp(4rem,15vw,10rem)] font-black tracking-tighter mb-2 glow animate-pulse" style="font-family: 'Space Grotesk', sans-serif;">
            KONG
        </h1>
        
        <div class="glass px-6 py-2 rounded-full inline-block mb-8">
            <p class="text-gray-400 tracking-[0.3em] uppercase text-[10px] md:text-xs font-medium">探索未知的数字边界</p>
        </div>

        <div class="mb-12">
            <p class="text-lg md:text-2xl text-gray-300 leading-relaxed font-light tracking-tight">
                “代码不是目的，创造才是。” <br>
                在这里，我们定义规则，或者打破它们。
            </p>
        </div>

        <div class="flex flex-col items-center space-y-4 max-w-sm mx-auto">
            <button onclick="exploreNow()" class="w-full bg-white text-black py-5 rounded-full font-black text-lg transition-all duration-500 hover:scale-105 active:scale-95 shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                开启探索
            </button>

            <button onclick="transitionTo('choice.html')" class="ios-glass w-full py-5 rounded-full flex items-center justify-between px-8 group transition-all duration-300 hover:bg-white/10">
                <div class="flex items-center space-x-3">
                    <span class="text-xs font-bold tracking-[0.2em] uppercase opacity-80">前途量化分析</span>
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                </div>
                <span class="text-[10px] font-black text-emerald-400 tracking-widest animate-pulse">NEW</span>
            </button>

            <div class="grid grid-cols-2 gap-3 w-full">
                <button onclick="transitionTo('glass.html')" class="glass py-4 rounded-full text-[10px] tracking-[0.2em] text-gray-400 hover:text-white btn-hover-effect uppercase">
                    实验室
                </button>
                <button onclick="transitionTo('games.html')" class="glass py-4 rounded-full text-[10px] tracking-[0.2em] text-gray-400 hover:text-white btn-hover-effect uppercase">
                    云端娱乐
                </button>
            </div>
        </div>
    </main>

    <section id="inner-space" class="relative z-20 text-center px-6 w-full">
        <h2 class="text-xs tracking-[1em] text-white/40 mb-8 uppercase">Introduction / KONG</h2>
        <div class="space-y-6 max-w-lg mx-auto">
            <div class="glass p-8 rounded-[2.5rem]">
                <p class="text-left text-gray-300 leading-relaxed text-lg">
                    你好，我是 <span class="text-white font-bold text-2xl">KONG</span>。<br><br>
                    我是一名深耕于代码与美学交界的开发者。我坚信最高级的页面不仅是视觉的堆砌，更是交互的呼吸。
                </p>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-6 rounded-[2rem]">
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Role</p>
                    <p class="font-bold">Creator</p>
                </div>
                <div class="glass p-6 rounded-[2rem]">
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Status</p>
                    <p class="font-bold">Online</p>
                </div>
            </div>
        </div>
        <button onclick="goBack()" class="mt-16 text-gray-600 hover:text-white text-[10px] tracking-[0.5em] uppercase transition-colors">Return to Surface</button>
    </section>

    <footer class="fixed bottom-8 w-full text-center text-gray-600 text-[10px] tracking-[0.5em] z-10 pointer-events-none">
        &copy; 2026 KONG STUDIO. ALL RIGHTS RESERVED.
    </footer>

    <script>
        // 1. 粒子背景系统优化（支持高倍屏）
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let dpr = window.devicePixelRatio || 1;
        
        function resize() {
            canvas.width = window.innerWidth * dpr;
            canvas.height = window.innerHeight * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, isClick = false) {
                this.x = x || Math.random() * window.innerWidth;
                this.y = y || Math.random() * window.innerHeight;
                this.size = isClick ? Math.random() * 4 + 1 : Math.random() * 1.5;
                this.speedX = (Math.random() - 0.5) * (isClick ? 8 : 0.4);
                this.speedY = (Math.random() - 0.5) * (isClick ? 8 : 0.4);
                this.opacity = 1;
                this.isClick = isClick;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.isClick) this.opacity -= 0.02;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.isClick ? this.opacity : 0.2})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for(let i=0; i<60; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.isClick && p.opacity <= 0) particles.splice(i, 1);
            });
            if (particles.filter(p => !p.isClick).length < 60) particles.push(new Particle());
            requestAnimationFrame(animate);
        }
        animate();

        // 2. 交互逻辑
        window.addEventListener('mousedown', (e) => {
            for(let i=0; i<8; i++) particles.push(new Particle(e.clientX, e.clientY, true));
        });

        // 3. 平滑光标系统 (Lerp 算法)
        const cursor = document.getElementById('cursor');
        let mouse = { x: 0, y: 0 };
        let cursorPos = { x: 0, y: 0 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function updateCursor() {
            cursorPos.x += (mouse.x - cursorPos.x) * 0.15;
            cursorPos.y += (mouse.y - cursorPos.y) * 0.15;
            cursor.style.transform = `translate3d(${cursorPos.x - 6}px, ${cursorPos.y - 6}px, 0)`;
            requestAnimationFrame(updateCursor);
        }
        updateCursor();

        // 4. 页面切换逻辑
        const home = document.getElementById('home-page');
        const inner = document.getElementById('inner-space');

        function exploreNow() {
            home.classList.add('dimension-exit');
            setTimeout(() => {
                home.style.display = 'none';
                inner.style.display = 'block';
                inner.classList.remove('dimension-exit');
                inner.classList.add('page-transition');
                inner.style.opacity = '1';
            }, 700);
        }

        function goBack() {
            inner.classList.add('dimension-exit');
            setTimeout(() => {
                inner.style.display = 'none';
                inner.classList.remove('dimension-exit');
                home.style.display = 'block';
                home.classList.remove('dimension-exit');
                home.classList.add('page-transition');
            }, 700);
        }

        function transitionTo(url) {
            const main = document.querySelector('main');
            main.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
            main.style.transform = 'scale(1.1)';
            main.style.filter = 'blur(20px)';
            main.style.opacity = '0';
            setTimeout(() => { window.location.href = url; }, 500);
        }
    </script>
</body>
</html>
