<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KONG - 未来已来</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Grotesk:wght@700&display=swap');
        
        :root { --accent: #ffffff; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        /* 顶级背景 */
        #bg-canvas { position: fixed; inset: 0; z-index: 0; }
        .glow-sphere {
            position: absolute; border-radius: 50%; filter: blur(120px); z-index: 1; opacity: 0.3;
            animation: move 20s infinite alternate ease-in-out;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(10%, 10%); }
        }

        /* 核心视觉 */
        .glow { text-shadow: 0 0 30px rgba(255,255,255,0.3); }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.5s ease;
        }

        /* --- 修复小白点：默认隐藏 --- */
        #cursor {
            width: 12px; height: 12px; background: #fff; border-radius: 50%;
            position: fixed; pointer-events: none; z-index: 9999;
            mix-blend-mode: difference; transition: transform 0.1s ease;
            display: none; /* 默认不显示 */
        }

        /* 只有当设备支持鼠标（非触屏）时才显示小白点 */
        @media (pointer: fine) {
            #cursor { display: block; }
        }

        /* 转场动画 */
        .page-transition { animation: zoomIn 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards; }
        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }

        .dimension-exit { animation: zoomOut 0.8s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
        @keyframes zoomOut {
            to { opacity: 0; transform: scale(1.2); filter: blur(20px); }
        }

        #inner-space { display: none; opacity: 0; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">

    <canvas id="bg-canvas"></canvas>
    <div class="glow-sphere w-[500px] h-[500px] bg-purple-900/20 top-[-10%] left-[-10%]"></div>
    <div class="glow-sphere w-[600px] h-[600px] bg-blue-900/20 bottom-[-10%] right-[-10%]" style="animation-delay: -5s;"></div>
    
    <div id="cursor"></div>

    <main id="home-page" class="relative z-10 text-center px-4 page-transition">
        <h1 class="text-7xl md:text-[12rem] font-black tracking-tighter mb-4 glow animate-pulse" style="font-family: 'Space Grotesk', sans-serif;">
            KONG
        </h1>
        
        <div class="glass px-8 py-4 rounded-full inline-block mb-10">
            <p class="text-gray-400 tracking-[0.3em] uppercase text-xs md:text-sm font-medium">探索未知的数字边界</p>
        </div>

        <div class="max-w-2xl mx-auto mb-16">
            <p class="text-xl md:text-3xl text-gray-300 leading-relaxed font-light tracking-tight">
                “代码不是目的，创造才是。” <br>
                在这里，我们定义规则，或者打破它们。
            </p>
        </div>

        <div class="mt-12">
            <button onclick="exploreNow()" class="group relative bg-white text-black px-12 py-5 rounded-full font-black text-lg transition-all duration-500 hover:scale-110 active:scale-95 shadow-[0_0_30px_rgba(255,255,255,0.2)]">
                开启探索
            </button>
        </div>
        
  <div class="mt-6">
    <button onclick="transitionToLab()" class="glass px-8 py-3 rounded-full text-xs tracking-[0.3em] text-gray-400 hover:text-white hover:border-white/40 transition-all duration-500 uppercase">
        进入实验室
    </button>
</div>

<script>
function transitionToLab() {
    // 模拟 iOS 桌面图标被点开的缩放感
    const main = document.querySelector('main');
    main.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
    main.style.transform = 'scale(1.5)';
    main.style.filter = 'blur(20px)';
    main.style.opacity = '0';
    
    setTimeout(() => {
        window.location.href = 'glass.html';
    }, 600);
}
</script>

<div class="mt-4">
    <button onclick="transitionTo('games.html')" class="glass px-10 py-4 rounded-full text-xs tracking-[0.3em] text-white/60 hover:text-white hover:bg-white/10 transition-all duration-500 uppercase border border-white/5">
        云端娱乐中心
    </button>
</div>

<script>
// 通用的丝滑跳转函数
function transitionTo(url) {
    const main = document.querySelector('main') || document.body;
    main.style.transition = 'all 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
    main.style.transform = 'scale(0.9) translateY(-20px)'; // 向上轻微漂浮并缩小
    main.style.filter = 'blur(15px)';
    main.style.opacity = '0';
    
    setTimeout(() => {
        window.location.href = url;
    }, 600);
}
</script>

    </main>

    <section id="inner-space" class="relative z-20 text-center px-6">
        <h2 class="text-xs tracking-[1em] text-white/40 mb-8 uppercase">Introduction / KONG</h2>
        <div class="space-y-6">
            <div class="glass p-8 rounded-[2rem] max-w-lg mx-auto">
                <p class="text-left text-gray-400 leading-relaxed text-lg">
                    你好，我是 <span class="text-white font-bold text-2xl">KONG</span>。<br><br>
                    我是一名深耕于代码与美学交界的开发者。我坚信最高级的页面不仅是视觉的堆砌，更是交互的呼吸。
                </p>
            </div>
            <div class="grid grid-cols-2 gap-4 max-w-lg mx-auto">
                <div class="glass p-6 rounded-[2rem] text-center">
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Role</p>
                    <p class="font-bold">Creator</p>
                </div>
                <div class="glass p-6 rounded-[2rem] text-center">
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Status</p>
                    <p class="font-bold">Online</p>
                </div>
            </div>
        </div>
        <button onclick="goBack()" class="mt-16 text-gray-600 hover:text-white text-[10px] tracking-[0.5em] uppercase transition-colors">Return to Surface</button>
    </section>

    <footer class="fixed bottom-8 w-full text-center text-gray-600 text-[10px] tracking-[0.5em] z-10 pointer-events-none">
        &copy; 2026 KONG STUDIO. ALL RIGHTS RESERVED.
    </footer>

    <script>
        // 1. 粒子背景系统
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, isClick = false) {
                this.x = x || Math.random() * canvas.width;
                this.y = y || Math.random() * canvas.height;
                this.size = isClick ? Math.random() * 4 + 1 : Math.random() * 1.5;
                this.speedX = (Math.random() - 0.5) * (isClick ? 10 : 0.5);
                this.speedY = (Math.random() - 0.5) * (isClick ? 10 : 0.5);
                this.opacity = 1;
                this.isClick = isClick;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.isClick) this.opacity -= 0.02;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.isClick ? this.opacity : 0.2})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initBackground() {
            particles = [];
            for(let i=0; i<60; i++) particles.push(new Particle());
        }
        initBackground();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.isClick && p.opacity <= 0) particles.splice(i, 1);
            });
            if (particles.filter(p => !p.isClick).length < 60) particles.push(new Particle());
            requestAnimationFrame(animate);
        }
        animate();

        // 交互逻辑：点击特效
        const handleInteraction = (x, y) => {
            for(let i=0; i<8; i++) particles.push(new Particle(x, y, true));
        };

        window.addEventListener('mousedown', (e) => handleInteraction(e.clientX, e.clientY));
        window.addEventListener('touchstart', (e) => handleInteraction(e.touches[0].clientX, e.touches[0].clientY));

        // 光标随动 (仅在PC端运行)
        const cursor = document.getElementById('cursor');
        window.addEventListener('mousemove', (e) => {
            if (cursor.style.display !== 'none') {
                cursor.style.transform = `translate3d(${e.clientX - 6}px, ${e.clientY - 6}px, 0)`;
            }
        });

        // 页面切换逻辑
        const home = document.getElementById('home-page');
        const inner = document.getElementById('inner-space');

        function exploreNow() {
            home.classList.add('dimension-exit');
            setTimeout(() => {
                home.style.display = 'none';
                inner.style.display = 'block';
                inner.classList.add('page-transition');
                inner.style.opacity = '1';
            }, 700);
        }

        function goBack() {
            inner.classList.add('dimension-exit');
            setTimeout(() => {
                inner.style.display = 'none';
                inner.classList.remove('dimension-exit');
                home.style.display = 'block';
                home.classList.remove('dimension-exit');
                home.classList.add('page-transition');
            }, 700);
        }
    </script>
</body>
</html>
